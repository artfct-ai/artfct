name: Pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ao
  # First parent: the merge base on a pull request, the previous commit on main, which only takes squash merges.
  TURBO_SCM_BASE: HEAD^1

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # One group per pull request
      group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Fail when the lockfile does not match the workspace manifests
        run: bun install --lockfile-only && git diff --exit-code bun.lock
      - run: bun run check:affected

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: smoke-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run smoke

  quint_specs:
    name: quint specs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      setups: ${{ steps.list.outputs.setups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: List each spec's setups and its replay test
        id: list
        working-directory: packages/orchestrator
        run: echo "setups=$(bun scripts/spec/check-spec.ts setups)" >> "$GITHUB_OUTPUT"

  quint_spec:
    name: quint spec (${{ matrix.spec }}, ${{ matrix.setup }})
    needs: quint_specs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.quint_specs.outputs.setups) }}
    defaults:
      run:
        working-directory: packages/orchestrator
    env:
      SPEC: ${{ matrix.spec }}
      SETUP: ${{ matrix.setup }}
      REPLAY: ${{ matrix.replay }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - if: ${{ matrix.tlc }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.12+8"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/orchestrator/scripts/spec/tlc-tools.ts') }}
          restore-keys: quint-${{ runner.os }}-
      - run: bunx quint typecheck "../../spec/$SPEC/$SETUP.qnt"
      - name: Fail when a witness is never reached
        run: bun scripts/spec/check-spec.ts witnesses "$SPEC" "$SETUP"
      - name: Run every invariant on 100,000 samples
        run: bun scripts/spec/check-spec.ts simulate "$SPEC" "$SETUP" 100000
      - name: Check every state within the pull request bounds with TLC
        if: ${{ !cancelled() && matrix.tlc }}
        run: bun scripts/spec/check-spec.ts tlc "$SPEC" "$SETUP" pr
      - if: ${{ !cancelled() && matrix.replay != '' }}
        run: bun run template-config
      - name: Replay the spec traces through the workflow
        if: ${{ !cancelled() && matrix.replay != '' }}
        run: |
          if [[ "$REPLAY" == *.test.medium.ts ]]; then
            bunx vitest run "./$REPLAY" --testNamePattern "on $SETUP\$" --passWithNoTests
          else
            bun test "./$REPLAY" --test-name-pattern "on $SETUP\$" --pass-with-no-tests
          fi

  e2e_property_test:
    name: e2e property based test (shard ${{ matrix.shard }})
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: packages/orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run template-config
      - name: Seed this shard from the run id and the shard index
        id: seed
        run: echo "PROPERTY_SEED=$(( (GITHUB_RUN_ID + SHARD) % 2147483648 ))" >> "$GITHUB_ENV"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Run the workflow properties
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: bun scripts/properties/e2e-property-test.ts workflow
      - name: Run the agent turn property
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: bun scripts/properties/e2e-property-test.ts agent_turn
      - name: Run the router property
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: bun scripts/properties/e2e-property-test.ts router
      - name: Replay the router bindings spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: bun scripts/properties/e2e-property-test.ts router_bindings
      - name: Replay the review loop spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: bun scripts/properties/e2e-property-test.ts review_loop
      - name: Replay the workflow lifecycle spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: bun scripts/properties/e2e-property-test.ts workflow_lifecycle
      - name: Replay the harness session spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: bun scripts/properties/e2e-property-test.ts harness_session

  coverage_check:
    name: coverage check
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run template-config
      - name: Check that the workflow properties cover every coverage case
        run: COVERAGE_CHECK=1 bun test ./src/workflow/invariants.test.ts -t "coverage check"

  preview:
    name: preview
    needs: [ci, smoke, e2e_property_test, coverage_check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # In commit order, so the `@main` tag ends on the newest commit.
      group: preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the sandbox image to Docker Hub unless turbo has it cached
        run: |
          bunx turbo run sandbox-image --filter=@artfct-ai/orchestrator
          echo "SANDBOX_IMAGE=$(cat packages/orchestrator/dist/sandbox-image/published-image)" >> "$GITHUB_ENV"
      - name: Point the main tag at the sandbox image
        run: docker buildx imagetools create --prefer-index=false --tag docker.io/artfct/sandbox:main "$SANDBOX_IMAGE"
      - run: bun run build --filter=@artfct-ai/core --filter=artfct
      - name: Confirm the core package names the published image
        run: cat packages/core/dist/sandbox/published-image
      - name: Publish the preview packages to pkg.pr.new
        run: bunx pkg-pr-new publish --bun --no-compact --no-template --comment=off ./packages/core ./packages/cli
      - name: Start the deploy of the install that tracks main
        run: gh workflow run deploy.yml --ref main --repo "$PREVIEW_DEPLOY_REPO"
        env:
          PREVIEW_DEPLOY_REPO: ${{ secrets.PREVIEW_DEPLOY_REPO }}
          GH_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
