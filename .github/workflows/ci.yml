name: Pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Each push to main gets its own group, so every commit runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ao
  # First parent: the merge base on a pull request, the previous commit on main, which only takes squash merges.
  TURBO_SCM_BASE: HEAD^1

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Fail when the lockfile does not match the workspace manifests
        run: bun install --lockfile-only && git diff --exit-code bun.lock
      - run: bun run check:affected
      - run: bun run smoke

  quint:
    name: quint (shard ${{ matrix.shard }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
        working-directory: packages/orchestrator
    env:
      SHARD_INDEX: ${{ strategy.job-index }}
      SHARD_COUNT: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Check whether the pull request changes the specs or the code they model
        id: paths
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD | grep -E '^(spec/|packages/orchestrator/(scripts/spec|src/workflow|src/agent|src/router|test)/|bun\.lock$|\.github/workflows/ci\.yml$)' || true)
          echo "changed=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.paths.outputs.changed == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - if: steps.paths.outputs.changed == 'true'
        run: bun install --frozen-lockfile
      - if: steps.paths.outputs.changed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/orchestrator/scripts/spec/tlc-tools.ts') }}
          restore-keys: quint-${{ runner.os }}-
      - name: Typecheck, check the witnesses, and run every invariant on 10,000 samples for each setup of this shard
        if: steps.paths.outputs.changed == 'true'
        run: |
          status=0
          for entry in $(bun scripts/spec/check-spec.ts setups | jq -r --argjson index "$SHARD_INDEX" --argjson count "$SHARD_COUNT" 'to_entries[] | select(.key % $count == $index) | .value | "\(.spec)/\(.setup)"'); do
            spec=${entry%/*}
            setup=${entry#*/}
            echo "::group::$setup of $spec"
            if ! {
              bunx quint typecheck "../../spec/$spec/$setup.qnt" &&
                bun scripts/spec/check-spec.ts witnesses "$spec" "$setup" &&
                bun scripts/spec/check-spec.ts simulate "$spec" "$setup" 10000
            }; then
              status=1
              echo "::error::$setup of $spec failed. Its group in this step's log has the output."
            fi
            echo "::endgroup::"
          done
          exit "$status"
      - if: ${{ !cancelled() && steps.paths.outputs.changed == 'true' }}
        run: bun run template-config
      - name: Replay this shard's share of the spec traces through the code at the default count
        if: ${{ !cancelled() && steps.paths.outputs.changed == 'true' }}
        run: |
          status=0
          for replay in $(bun scripts/spec/check-spec.ts setups | jq -r --argjson index "$SHARD_INDEX" --argjson count "$SHARD_COUNT" 'map(.replay) | unique | map(select(. != "")) | to_entries[] | select(.key % $count == $index) | .value'); do
            if [[ "$replay" == *.test.medium.ts ]]; then
              bunx vitest run "./$replay" || status=1
            else
              bun test "./$replay" || status=1
            fi
          done
          exit "$status"

  quint_specs:
    name: quint specs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      specs: ${{ steps.list.outputs.specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: List the specs
        id: list
        working-directory: packages/orchestrator
        run: echo "specs=$(bun scripts/spec/check-spec.ts setups | jq -c 'map(.spec) | unique')" >> "$GITHUB_OUTPUT"

  quint_spec:
    name: quint spec (${{ matrix.spec }})
    needs: quint_specs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJSON(needs.quint_specs.outputs.specs) }}
    defaults:
      run:
        shell: bash
        working-directory: packages/orchestrator
    env:
      SPEC: ${{ matrix.spec }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: List the setups of the spec and the ones TLC checks
        run: |
          setups=$(bun scripts/spec/check-spec.ts setups)
          echo "SETUPS=$(jq -r --arg spec "$SPEC" 'map(select(.spec == $spec) | .setup) | join(" ")' <<< "$setups")" >> "$GITHUB_ENV"
          echo "TLC_SETUPS=$(jq -r --arg spec "$SPEC" 'map(select(.spec == $spec and .tlc) | .setup) | join(" ")' <<< "$setups")" >> "$GITHUB_ENV"
      - if: env.TLC_SETUPS != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.12+8"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/orchestrator/scripts/spec/tlc-tools.ts') }}
          restore-keys: quint-${{ runner.os }}-
      - name: Typecheck each setup
        run: |
          for setup in $SETUPS; do bunx quint typecheck "../../spec/$SPEC/$setup.qnt"; done
      - name: Fail when a witness is never reached
        run: |
          status=0
          for setup in $SETUPS; do bun scripts/spec/check-spec.ts witnesses "$SPEC" "$setup" || status=1; done
          exit "$status"
      - name: Run every invariant on 100,000 samples
        if: ${{ !cancelled() }}
        run: |
          status=0
          for setup in $SETUPS; do bun scripts/spec/check-spec.ts simulate "$SPEC" "$setup" 100000 || status=1; done
          exit "$status"
      - name: Check every state within the pr bounds with TLC
        if: ${{ !cancelled() && env.TLC_SETUPS != '' }}
        run: |
          status=0
          for setup in $TLC_SETUPS; do bun scripts/spec/check-spec.ts tlc "$SPEC" "$setup" pr || status=1; done
          exit "$status"

  spec_replays:
    name: spec replays
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: packages/orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run template-config
      - name: Seed the replays from the run id
        id: seed
        run: echo "PROPERTY_SEED=$(( GITHUB_RUN_ID % 2147483648 ))" >> "$GITHUB_ENV"
      - name: Replay the router bindings spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: bun scripts/properties/e2e-property-test.ts router_bindings
      - name: Replay the review loop spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: bun scripts/properties/e2e-property-test.ts review_loop
      - name: Replay the workflow lifecycle spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: bun scripts/properties/e2e-property-test.ts workflow_lifecycle
      - name: Replay the harness session spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: bun scripts/properties/e2e-property-test.ts harness_session
      - name: Replay the agent turns spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: bun scripts/properties/e2e-property-test.ts agent_turns

  e2e_property_test:
    name: e2e property based test (light)
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/orchestrator
    env:
      PROPERTY_RUNS_DIVISOR: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run template-config
      - name: Seed the properties from the run id
        id: seed
        run: echo "PROPERTY_SEED=$(( GITHUB_RUN_ID % 2147483648 ))" >> "$GITHUB_ENV"
      - name: Run the workflow properties
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 15
        run: bun scripts/properties/e2e-property-test.ts workflow
      - name: Run the agent turn property
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 15
        run: bun scripts/properties/e2e-property-test.ts agent_turn
      - name: Run the router property
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 15
        run: bun scripts/properties/e2e-property-test.ts router

  preview:
    name: preview
    needs: [ci, quint_spec, spec_replays, e2e_property_test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # In commit order, so the `@main` tag ends on the newest commit.
      group: preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the sandbox image to Docker Hub unless turbo has it cached
        run: |
          bunx turbo run sandbox-image --filter=@artfct-ai/orchestrator
          echo "SANDBOX_IMAGE=$(cat packages/orchestrator/dist/sandbox-image/published-image)" >> "$GITHUB_ENV"
      - name: Point the main tag at the sandbox image
        run: docker buildx imagetools create --prefer-index=false --tag docker.io/artfct/sandbox:main "$SANDBOX_IMAGE"
      - run: bun run build --filter=@artfct-ai/core --filter=artfct
      - name: Confirm the core package names the published image
        run: cat packages/core/dist/sandbox/published-image
      - name: Publish the preview packages to pkg.pr.new
        run: bunx pkg-pr-new publish --bun --no-compact --no-template --comment=off ./packages/core ./packages/cli
      - name: Start the deploy of the install that tracks main
        run: gh workflow run deploy.yml --ref main --repo "$PREVIEW_DEPLOY_REPO"
        env:
          PREVIEW_DEPLOY_REPO: ${{ secrets.PREVIEW_DEPLOY_REPO }}
          GH_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
