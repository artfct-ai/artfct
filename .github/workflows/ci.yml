name: Pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ao
  # First parent: the merge base on a pull request, the previous commit on main, which only takes squash merges.
  TURBO_SCM_BASE: HEAD^1

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # One group per pull request
      group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:affected

  preview:
    name: preview
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # In commit order, so the `@main` tag ends on the newest commit.
      group: preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build --filter=@artfct-ai/sandbox-bridge
      - name: Tag the sandbox image with a hash of the files it is built from
        id: image-tag
        run: |
          inputs=(
            packages/orchestrator/sandbox/Dockerfile
            packages/orchestrator/sandbox/NOTICES.md
            packages/orchestrator/sandbox/agents/package.json
            packages/orchestrator/sandbox/agents/package-lock.json
            packages/sandbox-bridge/dist/artfct-bridge
            LICENSE
            NOTICE
          )
          echo "tag=$(sha256sum "${inputs[@]}" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Find an image already published from the same files
        id: published
        run: |
          digest=$(docker buildx imagetools inspect "docker.io/artfct/sandbox:$TAG" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest || true)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ steps.image-tag.outputs.tag }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.published.outputs.digest == ''
      - name: Publish the sandbox image to Docker Hub
        id: image
        if: steps.published.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/orchestrator/sandbox/Dockerfile
          platforms: linux/amd64
          # A single-platform manifest, so the digest names the image itself.
          provenance: false
          sbom: false
          push: true
          tags: docker.io/artfct/sandbox:${{ steps.image-tag.outputs.tag }}
      - run: bun run build --filter=@artfct-ai/core --filter=artfct
        env:
          SANDBOX_IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
          SANDBOX_IMAGE_DIGEST: ${{ steps.published.outputs.digest || steps.image.outputs.digest }}
      - name: Confirm the core package names the published image
        run: cat packages/core/dist/sandbox/published-image
      - name: Publish the preview packages to pkg.pr.new
        run: bunx pkg-pr-new publish --bun --no-compact --no-template --comment=off ./packages/core ./packages/cli
      - name: Start the deploy of the install that tracks main
        run: gh workflow run deploy.yml --ref main --repo "$PREVIEW_DEPLOY_REPO"
        env:
          PREVIEW_DEPLOY_REPO: ${{ secrets.PREVIEW_DEPLOY_REPO }}
          GH_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
