name: Pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ao
  # First parent: the merge base on a pull request, the previous commit on main, which only takes squash merges.
  TURBO_SCM_BASE: HEAD^1

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # One group per pull request
      group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Fail when the lockfile does not match the workspace manifests
        run: bun install --lockfile-only && git diff --exit-code bun.lock
      - run: bun run check:affected

  review_loop_spec:
    name: review loop spec (${{ matrix.setup }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - setup: judgeThenPolisher
            replay: true
            witnesses: aRefinerRunIsUnfinished aPromptWaitsWhileAPolisherRuns aRulingLandsOnARuledJudgeRun theAuthorGotARejection aRefinerRunEndsDone aRefinerRunStartsAfterAHandover aReviewerRunsAgainOnANewRevision theHumansHaveTheArtifact aReviewerReachedTheLimit aRefinerRunRestarted aPolisherFinished
          - setup: reviewerThenPolisher
            replay: true
            witnesses: aRefinerRunIsUnfinished aPromptWaitsWhileAPolisherRuns aRefinerRunEndsDone aRefinerRunStartsAfterAHandover aReviewerRunsAgainOnANewRevision theHumansHaveTheArtifact aReviewerReachedTheLimit aRefinerRunRestarted aPolisherFinished
          - setup: judgeBetweenReviewers
            replay: true
            witnesses: aRefinerRunIsUnfinished aRulingLandsOnARuledJudgeRun theAuthorGotARejection aRefinerRunEndsDone aRefinerRunStartsAfterAHandover aReviewerRunsAgainOnANewRevision theHumansHaveTheArtifact aReviewerReachedTheLimit aRefinerRunRestarted
          - setup: modelCallAuthorWithTwoReviewers
            witnesses: aRefinerRunIsUnfinished aPromptWaitsWhileAPolisherRuns aRefinerRunEndsDone aRefinerRunStartsAfterAHandover aReviewerRunsAgainOnANewRevision aStaleReviewRunsTheSegmentAgain theHumansHaveTheArtifact aReviewerReachedTheLimit aRefinerRunRestarted aPolisherFinished
    defaults:
      run:
        working-directory: packages/orchestrator
    env:
      SETUP: ${{ matrix.setup }}
      WITNESSES: ${{ matrix.witnesses }}
      SPEC: ../../spec/review-loop/${{ matrix.setup }}.qnt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: quint-${{ runner.os }}-
      - run: bunx quint typecheck "$SPEC"
      - name: Fail when a witness is never reached
        run: |
          bunx quint run "$SPEC" --main="$SETUP" --max-samples=10000 --max-steps=25 --witnesses $WITNESSES | tee "$RUNNER_TEMP/witnesses.log"
          ! grep "witnessed in 0 trace" "$RUNNER_TEMP/witnesses.log"
      - name: Run each invariant on 100,000 samples
        run: |
          violated=0
          for invariant in judgeRulesAtMostOnce oneUnfinishedRefinerRunPerArtifact authorIsIdleWhileAPolisherRuns refinerRunIsDoneOnlyAfterItsTurnEnded refinersRunAgainOnlyOnChangedRevision reviewerRunsOnlyOnAnUnreviewedRevision; do
            bunx quint run "$SPEC" --main="$SETUP" --invariant="$invariant" --max-samples=100000 --max-steps=25 || violated=1
          done
          exit "$violated"
      - if: ${{ !cancelled() && matrix.replay }}
        run: bun run template-config
      - name: Replay the spec traces through the workflow
        if: ${{ !cancelled() && matrix.replay }}
        run: bun test src/workflow/review-loop-replay.test.ts --test-name-pattern "on $SETUP\$"

  e2e_property_test:
    name: e2e property based test (shard ${{ matrix.shard }})
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: packages/orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run template-config
      - name: Seed this shard from the run id and the shard index
        id: seed
        run: echo "PROPERTY_SEED=$(( (GITHUB_RUN_ID + SHARD) % 2147483648 ))" >> "$GITHUB_ENV"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Run the workflow properties
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: bun scripts/properties/e2e-property-test.ts workflow
      - name: Run the agent turn property
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: bun scripts/properties/e2e-property-test.ts agent_turn
      - name: Run the router property
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: bun scripts/properties/e2e-property-test.ts router

  preview:
    name: preview
    needs: [ci, e2e_property_test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # In commit order, so the `@main` tag ends on the newest commit.
      group: preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the sandbox image to Docker Hub unless turbo has it cached
        run: |
          bunx turbo run sandbox-image --filter=@artfct-ai/orchestrator
          echo "SANDBOX_IMAGE=$(cat packages/orchestrator/dist/sandbox-image/published-image)" >> "$GITHUB_ENV"
      - name: Point the main tag at the sandbox image
        run: docker buildx imagetools create --prefer-index=false --tag docker.io/artfct/sandbox:main "$SANDBOX_IMAGE"
      - run: bun run build --filter=@artfct-ai/core --filter=artfct
      - name: Confirm the core package names the published image
        run: cat packages/core/dist/sandbox/published-image
      - name: Publish the preview packages to pkg.pr.new
        run: bunx pkg-pr-new publish --bun --no-compact --no-template --comment=off ./packages/core ./packages/cli
      - name: Start the deploy of the install that tracks main
        run: gh workflow run deploy.yml --ref main --repo "$PREVIEW_DEPLOY_REPO"
        env:
          PREVIEW_DEPLOY_REPO: ${{ secrets.PREVIEW_DEPLOY_REPO }}
          GH_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
