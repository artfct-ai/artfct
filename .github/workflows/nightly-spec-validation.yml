name: Nightly spec validation

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quint_specs:
    name: quint specs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.list.outputs.runs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List each spec's setups and invariants
        id: list
        run: |
          runs=$(jq -nc '[inputs | (input_filename | split("/")[1]) as $spec | .invariants[] as $invariant | .witnesses | keys[] | {spec: $spec, setup: ., invariant: $invariant}]' spec/*/checks.json)
          echo "runs=$runs" >> "$GITHUB_OUTPUT"

  quint_simulation:
    name: quint simulation (${{ matrix.spec }}, ${{ matrix.setup }}, ${{ matrix.invariant }})
    needs: quint_specs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.quint_specs.outputs.runs) }}
    defaults:
      run:
        working-directory: packages/orchestrator
    env:
      SPEC: ${{ matrix.spec }}
      SETUP: ${{ matrix.setup }}
      INVARIANT: ${{ matrix.invariant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: quint-${{ runner.os }}-
      - name: Run the invariant on 5,000,000 samples
        timeout-minutes: 30
        run: bunx quint run "../../spec/$SPEC/$SETUP.qnt" --main="$SETUP" --invariant="$INVARIANT" --max-samples=5000000 --max-steps=25 2>&1 | tee "$RUNNER_TEMP/quint.log"
      - name: Write the finding
        if: ${{ failure() }}
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          {
            printf '## Quint simulation: %s on %s of %s\n\nquint run on 5,000,000 samples failed or ran out of time. The seed in the log reproduces it.\n\n```\n' "$INVARIANT" "$SETUP" "$SPEC"
            tail -n 60 "$RUNNER_TEMP/quint.log"
            printf '```\n\n'
          } > "$RUNNER_TEMP/findings/simulation-$SPEC-$SETUP-$INVARIANT.md"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-findings-simulation-${{ matrix.spec }}-${{ matrix.setup }}-${{ matrix.invariant }}
          path: ${{ runner.temp }}/findings

  spec_validation:
    name: spec validation
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check the code against the glossary
        id: glossary
        continue-on-error: true
        run: bun test ./scripts/glossary/ 2>&1 | tee "$RUNNER_TEMP/glossary.log"
      - run: bun run template-config
        working-directory: packages/orchestrator
      - name: Run the property files against each mutant
        working-directory: packages/orchestrator
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          PROPERTY_SEED=$(( GITHUB_RUN_ID % 2147483648 )) bun scripts/properties/mutants.ts "$RUNNER_TEMP/findings/surviving-mutants.md"
      - name: Write the glossary finding
        if: ${{ !cancelled() && steps.glossary.outcome == 'failure' }}
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          {
            printf '## Glossary checks\n\nThe glossary checks failed.\n\n```\n'
            tail -n 80 "$RUNNER_TEMP/glossary.log"
            printf '```\n'
          } > "$RUNNER_TEMP/findings/glossary.md"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-findings-spec-validation
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore

  nightly_issue:
    name: nightly spec issue
    needs: [quint_simulation, spec_validation]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-findings-*
          path: ${{ runner.temp }}/findings
          merge-multiple: true
      - name: Open or update the nightly spec issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly spec validation findings
        run: |
          body="$RUNNER_TEMP/spec-issue.md"
          : > "$body"
          if [ -d "$RUNNER_TEMP/findings" ]; then
            find "$RUNNER_TEMP/findings" -name '*.md' | sort | xargs -r cat >> "$body"
          fi
          if [ ! -s "$body" ]; then exit 0; fi
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$body"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi
