name: Nightly spec validation

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to validate, to bisect a failure. Empty validates the branch the run starts on.
        required: false
        type: string

permissions:
  contents: read

jobs:
  quint_specs:
    name: quint specs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      setups: ${{ steps.list.outputs.setups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: List each spec's setups
        id: list
        working-directory: packages/orchestrator
        run: echo "setups=$(bun scripts/spec/check-spec.ts setups)" >> "$GITHUB_OUTPUT"

  quint_nightly:
    name: quint nightly (${{ matrix.spec }}, ${{ matrix.setup }})
    needs: quint_specs
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.quint_specs.outputs.setups) }}
    defaults:
      run:
        shell: bash
        working-directory: packages/orchestrator
    env:
      SPEC: ${{ matrix.spec }}
      SETUP: ${{ matrix.setup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - if: ${{ matrix.tlc }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.12+8"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/orchestrator/scripts/spec/tlc-tools.ts') }}
          restore-keys: quint-${{ runner.os }}-
      - name: Run every invariant on 5,000,000 samples
        id: simulation
        timeout-minutes: 180
        run: bun scripts/spec/check-spec.ts simulate "$SPEC" "$SETUP" 5000000 2>&1 | tee "$RUNNER_TEMP/simulation.log"
      - name: Check every state within the nightly bounds with TLC
        id: tlc
        if: ${{ !cancelled() && matrix.tlc }}
        timeout-minutes: 150
        run: bun scripts/spec/check-spec.ts tlc "$SPEC" "$SETUP" nightly 2>&1 | tee "$RUNNER_TEMP/tlc.log"
      - name: Write the findings
        if: ${{ !cancelled() && (steps.simulation.outcome == 'failure' || steps.tlc.outcome == 'failure') }}
        env:
          SIMULATION: ${{ steps.simulation.outcome }}
          TLC: ${{ steps.tlc.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          if [ "$SIMULATION" = failure ]; then
            {
              printf '## Quint simulation: %s of %s\n\nquint run on 5,000,000 samples failed or ran out of time. The seed in the log reproduces it.\n\n```\n' "$SETUP" "$SPEC"
              tail -n 60 "$RUNNER_TEMP/simulation.log"
              printf '```\n\n'
            } > "$RUNNER_TEMP/findings/simulation-$SPEC-$SETUP.md"
          fi
          if [ "$TLC" = failure ]; then
            {
              printf '## TLC: %s of %s\n\nTLC at the nightly bounds failed or ran out of time. The log ends with the shortest trace and the command that reproduces it.\n\n```\n' "$SETUP" "$SPEC"
              tail -n 150 "$RUNNER_TEMP/tlc.log"
              printf '```\n\n'
            } > "$RUNNER_TEMP/findings/tlc-$SPEC-$SETUP.md"
          fi
      - if: ${{ !cancelled() && (steps.simulation.outcome == 'failure' || steps.tlc.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-findings-quint-${{ matrix.spec }}-${{ matrix.setup }}
          path: ${{ runner.temp }}/findings

  spec_validation:
    name: spec validation
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check the code against the glossary
        id: glossary
        continue-on-error: true
        run: bun test ./scripts/glossary/ 2>&1 | tee "$RUNNER_TEMP/glossary.log"
      - run: bun run template-config
        working-directory: packages/orchestrator
      - name: Run the property files against each mutant
        working-directory: packages/orchestrator
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          PROPERTY_SEED=$(( GITHUB_RUN_ID % 2147483648 )) bun scripts/properties/mutants.ts "$RUNNER_TEMP/findings/surviving-mutants.md"
      - name: Write the glossary finding
        if: ${{ !cancelled() && steps.glossary.outcome == 'failure' }}
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          {
            printf '## Glossary checks\n\nThe glossary checks failed.\n\n```\n'
            tail -n 80 "$RUNNER_TEMP/glossary.log"
            printf '```\n'
          } > "$RUNNER_TEMP/findings/glossary.md"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-findings-spec-validation
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore

  e2e_property_test:
    name: e2e property based test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: packages/orchestrator
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run template-config
      - name: Seed this shard from the run id and the shard index
        id: seed
        run: |
          echo "PROPERTY_SEED=$(( (GITHUB_RUN_ID + SHARD) % 2147483648 ))" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/findings"
      - name: Run the workflow properties
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: GITHUB_STEP_SUMMARY="$RUNNER_TEMP/findings/workflow-$SHARD.md" bun scripts/properties/e2e-property-test.ts workflow
      - name: Run the agent turn property
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: GITHUB_STEP_SUMMARY="$RUNNER_TEMP/findings/agent_turn-$SHARD.md" bun scripts/properties/e2e-property-test.ts agent_turn
      - name: Run the router property
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: GITHUB_STEP_SUMMARY="$RUNNER_TEMP/findings/router-$SHARD.md" bun scripts/properties/e2e-property-test.ts router
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-findings-properties-${{ matrix.shard }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore

  spec_replays:
    name: spec replays
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: packages/orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run template-config
      - name: Seed the replays from the run id
        id: seed
        run: |
          echo "PROPERTY_SEED=$(( GITHUB_RUN_ID % 2147483648 ))" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/findings"
      - name: Replay the router bindings spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: GITHUB_STEP_SUMMARY="$RUNNER_TEMP/findings/router_bindings.md" bun scripts/properties/e2e-property-test.ts router_bindings
      - name: Replay the review loop spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: GITHUB_STEP_SUMMARY="$RUNNER_TEMP/findings/review_loop.md" bun scripts/properties/e2e-property-test.ts review_loop
      - name: Replay the workflow lifecycle spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: GITHUB_STEP_SUMMARY="$RUNNER_TEMP/findings/workflow_lifecycle.md" bun scripts/properties/e2e-property-test.ts workflow_lifecycle
      - name: Replay the harness session spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: GITHUB_STEP_SUMMARY="$RUNNER_TEMP/findings/harness_session.md" bun scripts/properties/e2e-property-test.ts harness_session
      - name: Replay the agent turns spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: GITHUB_STEP_SUMMARY="$RUNNER_TEMP/findings/agent_turns.md" bun scripts/properties/e2e-property-test.ts agent_turns
      - name: Replay the chat acknowledgement spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: GITHUB_STEP_SUMMARY="$RUNNER_TEMP/findings/chat_acknowledgement.md" bun scripts/properties/e2e-property-test.ts chat_acknowledgement
      - name: Replay the feedback routing spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 25
        run: GITHUB_STEP_SUMMARY="$RUNNER_TEMP/findings/feedback_routing.md" bun scripts/properties/e2e-property-test.ts feedback_routing
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-findings-spec-replays
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore

  coverage_check:
    name: coverage check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: packages/orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run template-config
      - name: Check that the workflow properties cover every coverage case
        id: coverage
        run: COVERAGE_CHECK=1 bun test ./src/workflow/invariants.test.ts -t "coverage check" 2>&1 | tee "$RUNNER_TEMP/coverage.log"
      - name: Write the finding
        if: ${{ !cancelled() && steps.coverage.outcome == 'failure' }}
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          {
            printf '## Coverage check\n\nThe workflow properties did not cover every coverage case in enough runs.\n\n```\n'
            tail -n 60 "$RUNNER_TEMP/coverage.log"
            printf '```\n\n'
          } > "$RUNNER_TEMP/findings/coverage.md"
      - if: ${{ !cancelled() && steps.coverage.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-findings-coverage
          path: ${{ runner.temp }}/findings

  nightly_issue:
    name: nightly spec issue
    needs: [quint_nightly, spec_validation, e2e_property_test, spec_replays, coverage_check]
    if: ${{ !cancelled() && !inputs.commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-findings-*
          path: ${{ runner.temp }}/findings
          merge-multiple: true
      - name: Open or update the nightly spec issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly spec validation findings
        run: |
          body="$RUNNER_TEMP/spec-issue.md"
          : > "$body"
          if [ -d "$RUNNER_TEMP/findings" ]; then
            find "$RUNNER_TEMP/findings" -name '*.md' | sort | xargs -r cat >> "$body"
          fi
          if [ ! -s "$body" ]; then exit 0; fi
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$body"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi
