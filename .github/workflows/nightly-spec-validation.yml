name: Nightly spec validation

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review_loop_model_check:
    name: review loop model check (${{ matrix.setup }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        setup:
          - judgeThenPolisher
          - reviewerThenPolisher
          - judgeBetweenReviewers
          - modelCallAuthorWithTwoReviewers
    defaults:
      run:
        working-directory: packages/orchestrator
    env:
      SETUP: ${{ matrix.setup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.quint
          key: quint-verify-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: quint-verify-${{ runner.os }}-
      - name: Check every invariant on every execution of up to 8 steps
        run: bunx quint verify "../../spec/review-loop/$SETUP.qnt" --main="$SETUP" --invariant=invariants --max-steps=8

  spec_validation:
    name: spec validation
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check the code against the glossary
        id: glossary
        continue-on-error: true
        run: bun test ./scripts/glossary/ 2>&1 | tee "$RUNNER_TEMP/glossary.log"
      - run: bun run template-config
        working-directory: packages/orchestrator
      - name: Run the property files against each mutant
        working-directory: packages/orchestrator
        run: PROPERTY_SEED=$(( GITHUB_RUN_ID % 2147483648 )) bun scripts/properties/mutants.ts "$RUNNER_TEMP/surviving-mutants.md"
      - name: Open or update the nightly spec issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GLOSSARY_OUTCOME: ${{ steps.glossary.outcome }}
          TITLE: Nightly spec validation findings
        run: |
          body="$RUNNER_TEMP/spec-issue.md"
          : > "$body"
          if [ -f "$RUNNER_TEMP/surviving-mutants.md" ]; then cat "$RUNNER_TEMP/surviving-mutants.md" >> "$body"; fi
          if [ "$GLOSSARY_OUTCOME" = failure ]; then
            {
              printf '## Glossary checks\n\nThe glossary checks failed.\n\n```\n'
              tail -n 80 "$RUNNER_TEMP/glossary.log"
              printf '```\n'
            } >> "$body"
          fi
          if [ ! -s "$body" ]; then exit 0; fi
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$body"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi
